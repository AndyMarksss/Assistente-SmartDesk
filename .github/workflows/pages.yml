name: Deploy SmartDesk to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "03-prototipo/**"
      - ".github/workflows/pages.yml"

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v6

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar entrada pública sem arquivos privados
        env:
          SMARTDESK_SERVICE_URL: ${{ vars.SMARTDESK_SERVICE_URL }}
        run: node 03-prototipo/scripts/build-pages.cjs pages-dist

      - name: Preparar arquivos do SmartDesk
        uses: actions/upload-pages-artifact@v4
        with:
          path: "./pages-dist"

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
