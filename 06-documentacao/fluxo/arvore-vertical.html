<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>SmartDesk — Árvore de decisões vertical</title>
    <!--
      Árvore de decisões completa do atendimento do SmartDesk 0.12.18, desenhada na vertical: a raiz
      (boas-vindas) em cima e cada escolha descendo até as folhas. Mesma estrutura da versão
      horizontal (arvore-estrutura.js); os 57 tipos de pedido vêm de gerar-caminhos.cjs.
      Passe o mouse sobre um passo para ver a pergunta exata do chat.
    -->
    <style>
      :root {
        --ink: #1d2033;
        --muted: #5d6278;
        --soft: #8a8fa6;
        --line: #cfd2df;
        --band: #f2f3f7;
        --paper: #ffffff;
        --bg: #eef0f5;
        --ai: #6a4bd6;
        --ai-ink: #43279f;
        --ai-soft: #f1ecff;
        --edge: #9ea3b7;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        display: flex;
        flex-direction: column;
        background: var(--bg);
        color: var(--ink);
        font: 13px/1.35 "Segoe UI", system-ui, -apple-system, sans-serif;
      }
      .bar {
        display: flex;
        align-items: center;
        gap: 18px;
        flex-wrap: wrap;
        padding: 10px 18px;
        background: var(--paper);
        border-bottom: 1px solid var(--line);
      }
      .bar h1 {
        margin: 0;
        font-size: 18px;
      }
      .bar h1 span {
        color: var(--ai);
      }
      .legend {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        color: var(--muted);
        font-size: 12px;
      }
      .legend i {
        display: inline-block;
        width: 22px;
        height: 13px;
        margin-right: 5px;
        vertical-align: -2px;
        border-radius: 4px;
        border: 1px solid var(--line);
        background: #fff;
      }
      .legend i.ai {
        background: var(--ai-soft);
        border: 1.5px solid var(--ai);
      }
      .legend i.dec {
        border-left: 4px solid var(--soft);
      }
      .legend i.rule {
        border: 1.5px dashed var(--soft);
      }
      .legend i.opt {
        border-radius: 999px;
        background: var(--band);
      }
      .legend i.ref {
        border: 1.5px dashed var(--line);
        border-radius: 999px;
        background: transparent;
      }
      .legend i.end {
        background: var(--ink);
        border-color: var(--ink);
      }
      .zoom {
        margin-left: auto;
        display: flex;
        gap: 6px;
      }
      .zoom button {
        font: inherit;
        padding: 4px 10px;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: var(--paper);
        cursor: pointer;
      }
      .zoom button.on {
        border-color: var(--ink);
        font-weight: 700;
      }
      .viewport {
        flex: 1;
        overflow: auto;
        cursor: grab;
      }
      .viewport.drag {
        cursor: grabbing;
      }
      .sizer {
        position: relative;
      }
      .canvas {
        position: absolute;
        left: 0;
        top: 0;
        transform-origin: 0 0;
      }
      .canvas svg {
        position: absolute;
        left: 0;
        top: 0;
        overflow: visible;
        pointer-events: none;
      }
      .band-title {
        position: absolute;
        font-size: 22px;
        font-weight: 800;
        letter-spacing: -0.3px;
        white-space: nowrap;
      }
      .band-title small {
        display: block;
        font-size: 13px;
        font-weight: 400;
        color: var(--muted);
        letter-spacing: 0;
      }
      .band-bg {
        position: absolute;
        border-radius: 22px;
        background: rgb(255 255 255 / 0.55);
        border: 1px solid #e1e3ec;
      }
      .n {
        position: absolute;
        width: 196px;
        padding: 6px 10px 7px;
        border-radius: 10px;
        border: 1px solid var(--line);
        background: var(--paper);
        box-shadow: 0 1px 2px rgb(29 32 51 / 0.06);
      }
      .n b {
        display: block;
        font-size: 13px;
      }
      .n small {
        display: block;
        margin-top: 2px;
        font-size: 11.5px;
        color: var(--muted);
      }
      .n.dec {
        border-left: 4px solid var(--soft);
      }
      .n.dec b::before {
        content: "◆ ";
        color: var(--soft);
        font-size: 10px;
        vertical-align: 1px;
      }
      .n.ai {
        background: var(--ai-soft);
        border: 1.5px solid var(--ai);
      }
      .n.ai.dec {
        border-left: 4px solid var(--ai);
      }
      .n.ai b,
      .n.ai.dec b::before {
        color: var(--ai-ink);
      }
      .n.ai b::after {
        content: " ✦ IA";
        font-size: 10px;
        font-weight: 800;
        color: var(--ai);
      }
      .n.rule {
        border: 1.5px dashed var(--soft);
        background: #fbfbfd;
      }
      .n.rule.dec {
        border-left: 4px solid var(--soft);
      }
      .n.sys {
        background: #f3f4f8;
      }
      .n.opt {
        width: max-content;
        max-width: 200px;
        padding: 4px 11px;
        border-radius: 999px;
        background: var(--band);
        font-weight: 600;
        font-size: 12px;
        white-space: normal;
      }
      .n.opt b {
        font-size: 12px;
      }
      .n.ref {
        width: max-content;
        max-width: 210px;
        padding: 4px 11px;
        border-radius: 999px;
        border: 1.5px dashed var(--line);
        background: transparent;
        box-shadow: none;
        color: var(--muted);
        font-style: italic;
      }
      .n.ref b {
        font-size: 12px;
        font-weight: 600;
      }
      .n.start,
      .n.end {
        background: var(--ink);
        border-color: var(--ink);
        color: #fff;
      }
      .n.start small,
      .n.end small {
        color: rgb(255 255 255 / 0.75);
      }
      .n.need {
        width: 214px;
        border: 1.5px solid var(--ink);
      }
      .n.need b {
        font-size: 13.5px;
      }
      .n.need code {
        font-size: 10.5px;
        color: var(--soft);
      }
      .n.need .tips {
        color: var(--ai-ink);
        font-weight: 700;
      }
      .n[title] {
        cursor: help;
      }
      .e {
        fill: none;
        stroke: var(--edge);
        stroke-width: 1.4;
      }
      .e.band-link {
        stroke: var(--ink);
        stroke-width: 2.2;
        stroke-dasharray: 8 6;
      }
      .lbl {
        position: absolute;
        transform: translate(-50%, -50%);
        padding: 0 6px;
        border-radius: 6px;
        background: var(--paper);
        border: 1px solid var(--line);
        font-size: 11px;
        color: var(--muted);
        white-space: nowrap;
      }
      .lbl.big {
        font-size: 13px;
        font-weight: 700;
        color: var(--ink);
        padding: 3px 10px;
        border-color: var(--ink);
      }
    </style>
  </head>
  <body>
    <div class="bar">
      <h1>SmartDesk · Árvore de decisões <span>vertical</span></h1>
      <div class="legend">
        <span><i class="dec"></i>Decisão</span>
        <span><i class="opt"></i>Escolha da pessoa</span>
        <span><i></i>Passo</span>
        <span><i class="ai"></i>A IA intervém</span>
        <span><i class="rule"></i>Regra fixa, sem IA</span>
        <span><i class="ref"></i>↺ volta · → pula para</span>
        <span><i class="end"></i>Início ou fim</span>
        <span>Passe o mouse num passo para ver a pergunta exata · arraste para mover</span>
      </div>
      <div class="zoom" id="zoom"></div>
    </div>
    <div class="viewport" id="viewport"><div class="sizer" id="sizer"><div class="canvas" id="canvas"><svg id="edges"></svg></div></div></div>

    <script>
      "use strict";
      // Árvore vertical: a sequência desce; os ramos de cada decisão ficam lado a lado logo abaixo
      // dela e convergem embaixo. Decisões com muitos ramos (wrap) quebram em linhas, ligadas por
      // uma espinha à esquerda; as saídas dessas linhas descem por uma faixa à direita.
      const GAP_V = 28,
        JOIN_V = 56,
        HGAP = 22,
        DROP = 34,
        ROWGAP = 58,
        WRAP = 3000,
        LANE = 24;
      const canvas = document.getElementById("canvas");
      const svg = document.getElementById("edges");
      const NS = "http://www.w3.org/2000/svg";
      const el = (tag, cls, text) => {
        const x = document.createElement(tag);
        if (cls) x.className = cls;
        if (text !== undefined) x.textContent = text;
        return x;
      };
      function makeNodes(b) {
        if (b.t === "seq") return b.items.forEach(makeNodes);
        if (b.t === "par") {
          makeNodes(b.dec);
          b.branches.forEach((br) => makeNodes(br.block));
          return;
        }
        const box = el("div", "n " + b.kind);
        if (b.id) box.id = b.id;
        box.append(el("b", "", b.title));
        if (b.need) {
          const n = b.need;
          box.querySelector("b").append(" ", el("code", "", n.id));
          const s = el("small", "");
          if (n.dicas) s.append(el("span", "tips", "✦ dicas da IA · "));
          s.append(b.flags);
          box.append(s);
        } else if (b.sub) box.append(el("small", "", b.sub));
        if (b.tip) box.title = b.tip;
        canvas.append(box);
        b.el = box;
      }
      const gapAfter = (it) => (it.t === "par" ? JOIN_V : GAP_V);
      const rowOf = (items) => ({
        items,
        w: items.reduce((s, x, i) => s + x.w + (i ? HGAP : 0), 0),
        h: Math.max(...items.map((x) => x.h)),
      });
      function pack(blocks) {
        const rows = [];
        let cur = [],
          cw = 0;
        for (const bl of blocks) {
          if (cur.length && cw + HGAP + bl.w > WRAP) {
            rows.push(cur);
            cur = [];
            cw = 0;
          }
          cw += (cur.length ? HGAP : 0) + bl.w;
          cur.push(bl);
        }
        if (cur.length) rows.push(cur);
        return rows.map(rowOf);
      }
      function measure(b) {
        if (b.t === "node") {
          b.w = b.el.offsetWidth;
          b.h = b.el.offsetHeight;
        } else if (b.t === "seq") {
          b.items.forEach(measure);
          b.w = Math.max(...b.items.map((it) => it.w));
          b.h = b.items.reduce((s, it, i) => s + it.h + (i ? gapAfter(b.items[i - 1]) : 0), 0);
        } else {
          measure(b.dec);
          const blocks = b.branches.map((br) => br.block);
          blocks.forEach(measure);
          b.rows = b.wrap ? pack(blocks) : [rowOf(blocks)];
          b.W = Math.max(...b.rows.map((r) => r.w));
          b.multi = b.rows.length > 1;
          b.w = Math.max(b.dec.w, b.W + (b.multi ? LANE * 2 : 0));
          b.h = b.dec.h + DROP + b.rows.reduce((s, r, i) => s + r.h + (i ? ROWGAP : 0), 0) + (b.multi ? 30 : 0);
        }
      }
      const paths = [];
      const labels = [];
      const line = (d, cls = "", arrow = true) => paths.push({ d, cls, arrow });
      function join(exits, entry) {
        const bus = entry.y - 18;
        for (const e of exits)
          line(Math.abs(e.x - entry.x) < 1 ? `M${e.x} ${e.y}V${entry.y}` : `M${e.x} ${e.y}V${bus}H${entry.x}V${entry.y}`);
      }
      function place(b, xc, top) {
        if (b.t === "node") {
          b.x = xc - b.w / 2;
          b.y = top;
          b.el.style.left = b.x + "px";
          b.el.style.top = top + "px";
          const stop = b.kind === "ref" || b.stop;
          return { entry: { x: xc, y: top }, exits: stop ? [] : [{ x: xc, y: top + b.h }] };
        }
        if (b.t === "seq") {
          let y = top,
            prev = null,
            entry = null;
          for (const it of b.items) {
            const r = place(it, xc, y);
            if (prev) join(prev, r.entry);
            else entry = r.entry;
            prev = r.exits;
            y += it.h + gapAfter(it);
          }
          return { entry, exits: prev };
        }
        const d = place(b.dec, xc, top);
        const decB = top + b.dec.h;
        let rowTop = decB + DROP;
        if (!b.multi) {
          const row = b.rows[0];
          let x = xc - row.w / 2;
          const bus = rowTop - 14;
          const exits = [];
          for (const bl of row.items) {
            const bx = x + bl.w / 2;
            const r = place(bl, bx, rowTop);
            line(Math.abs(bx - xc) < 1 ? `M${xc} ${decB}V${r.entry.y}` : `M${xc} ${decB}V${bus}H${bx}V${r.entry.y}`);
            exits.push(...r.exits);
            x += bl.w + HGAP;
          }
          return { entry: d.entry, exits };
        }
        // Várias linhas: uma espinha à esquerda desce da decisão até cada linha; as saídas de cada
        // linha vão pelo vão de baixo até a faixa da direita, que desce até o fim do bloco.
        const left = xc - b.W / 2,
          spine = left - LANE / 2,
          lane = left + b.W + LANE / 2;
        let lastBus = decB + 14,
          firstGutter = null,
          bottom = 0,
          any = false;
        for (const row of b.rows) {
          const bus = rowTop - 14;
          lastBus = bus;
          const gutter = rowTop + row.h + 16;
          let x = left;
          const centers = [];
          for (const bl of row.items) {
            const bx = x + bl.w / 2;
            centers.push(bx);
            const r = place(bl, bx, rowTop);
            line(`M${bx} ${bus}V${r.entry.y}`);
            for (const e of r.exits) {
              line(`M${e.x} ${e.y}V${gutter}H${lane}`, "", false);
              any = true;
              if (firstGutter === null || gutter < firstGutter) firstGutter = gutter;
            }
            x += bl.w + HGAP;
          }
          line(`M${spine} ${bus}H${Math.max(...centers)}`, "", false);
          bottom = rowTop + row.h + 30;
          rowTop += row.h + ROWGAP;
        }
        line(`M${xc} ${decB}V${decB + 14}H${spine}V${lastBus}`, "", false);
        if (!any) return { entry: d.entry, exits: [] };
        line(`M${lane} ${firstGutter}V${bottom}`, "", false);
        return { entry: d.entry, exits: [{ x: lane, y: bottom }] };
      }

      const faixas = window.ARVORE;
      faixas.forEach((f) => makeNodes(f.block));
      faixas.forEach((f) => measure(f.block));
      const MARGIN = 70,
        TITLE = 90,
        BAND_GAP = 110;
      const inner = Math.max(...faixas.map((f) => f.block.w));
      const width = inner + MARGIN * 2 + 80;
      const xc = MARGIN + 40 + inner / 2;
      let y = MARGIN;
      let prevExits = null;
      faixas.forEach((f, i) => {
        f.top = y;
        const r = place(f.block, xc, y + TITLE);
        f.bottom = y + TITLE + f.block.h;
        if (prevExits) {
          join(prevExits, r.entry);
          labels.push({ x: r.entry.x, y: f.top + 20, text: i === 1 ? "todos os caminhos continuam aqui ↓" : "continua ↓", big: true });
        }
        prevExits = r.exits;
        const t = el("div", "band-title", f.title);
        if (f.sub) t.append(el("small", "", f.sub));
        t.style.left = MARGIN + 30 + "px";
        t.style.top = y + 8 + "px";
        canvas.append(t);
        y = f.bottom + BAND_GAP;
      });
      const height = y - BAND_GAP + MARGIN;
      faixas.forEach((f) => {
        const bg = el("div", "band-bg");
        bg.style.left = MARGIN + "px";
        bg.style.top = f.top - 10 + "px";
        bg.style.width = width - MARGIN * 2 + "px";
        bg.style.height = f.bottom - f.top + 34 + "px";
        canvas.prepend(bg);
      });
      for (const p of paths) {
        const path = document.createElementNS(NS, "path");
        path.setAttribute("d", p.d);
        path.setAttribute("class", "e " + p.cls);
        if (p.arrow) path.setAttribute("marker-end", "url(#arrow)");
        svg.append(path);
      }
      const defs = document.createElementNS(NS, "defs");
      defs.innerHTML =
        '<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9ea3b7"/></marker>';
      svg.prepend(defs);
      for (const l of labels) {
        const t = el("div", "lbl" + (l.big ? " big" : ""), l.text);
        t.style.left = l.x + "px";
        t.style.top = l.y + "px";
        canvas.append(t);
      }
      canvas.style.width = width + "px";
      canvas.style.height = height + "px";
      svg.setAttribute("width", width);
      svg.setAttribute("height", height);
      window.TREE = { width, height, nodes: canvas.querySelectorAll(".n").length, bands: faixas.map((f) => [f.top, f.bottom]) };
      // ------------------------------------------------------------ zoom e arrastar
      const viewport = document.getElementById("viewport"),
        sizer = document.getElementById("sizer");
      let zoom = 1;
      function setZoom(z, keep) {
        const cx = viewport.scrollLeft + viewport.clientWidth / 2,
          cy = viewport.scrollTop + viewport.clientHeight / 2;
        const ratio = z / zoom;
        zoom = z;
        canvas.style.transform = "scale(" + z + ")";
        sizer.style.width = width * z + "px";
        sizer.style.height = height * z + "px";
        if (keep) {
          viewport.scrollLeft = cx * ratio - viewport.clientWidth / 2;
          viewport.scrollTop = cy * ratio - viewport.clientHeight / 2;
        }
        document.querySelectorAll("#zoom button").forEach((b) => b.classList.toggle("on", Number(b.dataset.z) === z));
      }
      const zoomBox = document.getElementById("zoom");
      [["Ver tudo", "fit"], ["25%", 0.25], ["50%", 0.5], ["75%", 0.75], ["100%", 1]].forEach(([label, z]) => {
        const b = el("button", "", label);
        b.dataset.z = z;
        b.addEventListener("click", () => setZoom(z === "fit" ? Math.min(viewport.clientWidth / width, viewport.clientHeight / height) : z, z !== "fit"));
        zoomBox.append(b);
      });
      viewport.addEventListener(
        "wheel",
        (e) => {
          if (!e.ctrlKey) return;
          e.preventDefault();
          setZoom(Math.min(1.5, Math.max(0.1, zoom * (e.deltaY < 0 ? 1.1 : 0.9))), true);
        },
        { passive: false },
      );
      let drag = null;
      viewport.addEventListener("pointerdown", (e) => {
        drag = { x: e.clientX, y: e.clientY, l: viewport.scrollLeft, t: viewport.scrollTop };
        viewport.classList.add("drag");
      });
      addEventListener("pointermove", (e) => {
        if (!drag) return;
        viewport.scrollLeft = drag.l - (e.clientX - drag.x);
        viewport.scrollTop = drag.t - (e.clientY - drag.y);
      });
      addEventListener("pointerup", () => {
        drag = null;
        viewport.classList.remove("drag");
      });
      setZoom(0.5);
      viewport.scrollTop = 0;
    </script>
  </body>
</html>
